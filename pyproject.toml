[project]
name = "batteryplan"
version = "0.1.0"
description = "Battery dispatch model maximising arbitrage profit across two wholesale electricity markets"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "matplotlib>=3.9",
    "openpyxl>=3.1",
    "pulp>=2.9",
    "highspy>=1.8",
]

[project.scripts]
battery-plan = "battery_plan.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.7",
    "pytest>=8.3",
    "mypy>=1.13",
    "pandas-stubs>=2.2",
    "jupyterlab>=4.3",
    "ipykernel>=7.4.0",
    "seaborn>=0.13.2",
    "jsonschema>=4.26.0",
    "moto[dynamodb,s3,sqs]>=5.0",
    { include-group = "solver" },
    { include-group = "aws" },
]
# What the solver Lambda (services/solver/) needs beyond the package, installed
# into its image.
solver = [
    "jsonschema>=4.26.0",
]
# The AWS SDK, which the Lambda base image already provides: only for running
# the solver locally and for its tests.
aws = [
    "boto3>=1.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/battery_plan"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "services/solver"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = [
    "E402",             # imports follow the opening markdown cell
    "B018",             # a bare expression is how a cell renders its output
    "RUF001",           # en dashes and minus signs belong in prose and axis labels
    "RUF002",
    "RUF003",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The solver Lambda's handler is a top-level module, as it is in its image.
pythonpath = ["services/solver"]
addopts = "-q"
markers = [
    "slow: re-derives a reference value by an exact solve; seconds, not milliseconds",
]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests", "services/solver"]
mypy_path = "services/solver"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["pulp.*", "matplotlib.*", "jsonschema.*", "boto3.*", "botocore.*", "moto.*"]
ignore_missing_imports = true
