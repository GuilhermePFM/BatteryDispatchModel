title: Battery dispatch and investment model
subtitle: Storage in Brazil's hourly PLD market, contracted and merchant
author: Guilherme Machado
abstract: |
  A model for valuing a battery in one of Brazil's four submarkets under
  two separate business cases: a capacity contract from the 2026 LRCAP storage
  auction, and merchant arbitrage against the hourly PLD. The dispatch is one
  linear program per submarket and case over the whole horizon. The contracted
  case adds the CRCAP limits on daily and rolling yearly cycles and a binary
  for the 12 hours of daily injection, solved only when the linear relaxation
  breaks that limit. An investment layer turns each solution into nominal cash
  flows with IPCA indexation, a nominal discount rate and real PLD growth, and
  reports NPV, IRR, payback, maximum viable capex and minimum viable bid.
