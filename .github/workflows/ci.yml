# Checks for every pull request and every push. No AWS access: the deploy
# role trusts main only (infra/bootstrap).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Python 3.12 from .python-version, dependencies from uv.lock.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.4"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: go
      - run: go vet ./...
      # The DynamoDB tests start amazon/dynamodb-local; the runner has docker.
      # A skip is a failure here too. `shell: bash` sets pipefail, so a failing
      # test still fails the step through the pipe.
      - shell: bash
        run: |
          go test -v ./... | tee go-test.log
          if grep -E '^\s*--- SKIP' go-test.log; then
            echo "::error::unexpected skipped Go tests"
            exit 1
          fi

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # node and pnpm from mise.toml; pnpm matches web/package.json packageManager.
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: node pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # A skipped or todo test is a failure here too.
      - run: |
          pnpm test --reporter=default --reporter=json --outputFile.json=vitest.json
          jq -e '.numPendingTests + .numTodoTests == 0' vitest.json
      # Reads ../contracts and ../docs/model, hence the full checkout.
      - run: pnpm build

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: terraform
      - run: terraform fmt -check -recursive infra
      - name: validate
        run: |
          for dir in infra/bootstrap infra/aws; do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done
