# Builds the three functions, applies infra/aws, builds the SPA against the
# applied stack with no AWS access, then publishes it. Setup and the GitHub
# secrets and variables it reads are in docs/deploy.md.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Each job that talks to AWS asks for id-token itself; the SPA build does not.
permissions:
  contents: read

# One deploy at a time, never cancelled half-way through an apply.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1

jobs:
  solver-image:
    # Native arm64 build: the solver Lambda runs on Graviton.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write # OIDC: the deploy role trusts this repository's main branch
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@7290e214a610b32bc0eef81748948b6d466a8783 # v2.2.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: services/solver/Dockerfile
          target: lambda
          platforms: linux/arm64
          push: true
          # Tags are immutable in the repository; a re-run gets its own tag.
          tags: ${{ steps.ecr.outputs.registry }}/batteryplan-solver:${{ github.sha }}-${{ github.run_attempt }}
          # Lambda takes a single-platform image manifest, not an index carrying
          # attestations.
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  api-zips:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: go
      - run: make zips
        working-directory: services/api
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-zips
          path: services/api/dist/*.zip
          if-no-files-found: error
          retention-days: 7

  apply:
    needs: [solver-image, api-zips]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TF_IN_AUTOMATION: "1"
      TF_INPUT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: api-zips
          path: services/api/dist
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: terraform
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform apply
        working-directory: infra/aws
        # The inputs, secrets among them, only where Terraform reads them.
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_VAR_solver_image_digest: ${{ needs.solver-image.outputs.digest }}
          TF_VAR_api_zip: ${{ github.workspace }}/services/api/dist/api.zip
          TF_VAR_dlq_zip: ${{ github.workspace }}/services/api/dist/dlq.zip
          TF_VAR_google_client_id: ${{ vars.GOOGLE_CLIENT_ID }}
          TF_VAR_google_client_secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          TF_VAR_budget_email: ${{ secrets.BUDGET_EMAIL }}
          # -1 is unreserved, for an account still on the 10-execution quota.
          TF_VAR_api_reserved_concurrency: ${{ vars.API_RESERVED_CONCURRENCY || '-1' }}
          # Phase 6, all optional (docs/deploy.md, "Custom domain").
          TF_VAR_site_domain: ${{ vars.SITE_DOMAIN }}
          TF_VAR_site_domain_attach: ${{ vars.SITE_DOMAIN_ATTACH || 'false' }}
          TF_VAR_auth_domain: ${{ vars.AUTH_DOMAIN }}
          TF_VAR_auth_domain_attach: ${{ vars.AUTH_DOMAIN_ATTACH || 'false' }}
        run: |
          terraform init -backend-config="bucket=$TF_STATE_BUCKET"
          terraform apply -auto-approve

      # Only what the SPA bundle makes public anyway.
      - name: export the SPA's configuration
        working-directory: infra/aws
        run: |
          # An assignment, not $(...) inside echo, so a failed read fails the step.
          vite_env=$(terraform output -json vite_env | jq -r 'to_entries[] | "\(.key)=\(.value)"')
          echo "$vite_env" > "$RUNNER_TEMP/vite.env"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vite-env
          path: ${{ runner.temp }}/vite.env
          if-no-files-found: error
          retention-days: 1

  # pnpm install and the build run third-party code: no AWS credentials and no
  # id-token here.
  build-web:
    needs: apply
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vite-env
          path: ${{ runner.temp }}/vite-env
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: node pnpm
      - name: build the SPA
        working-directory: web
        env:
          VITE_REPO_URL: ${{ github.server_url }}/${{ github.repository }}/blob/main
        run: |
          set -a
          . "$RUNNER_TEMP/vite-env/vite.env"
          set +a
          pnpm install --frozen-lockfile
          pnpm build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: web/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build-web
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TF_IN_AUTOMATION: "1"
      TF_INPUT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: terraform
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: read stack outputs
        working-directory: infra/aws
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          terraform init -backend-config="bucket=$TF_STATE_BUCKET"
          # Assignments, not $(...) inside echo, so a failed read fails the step.
          site_bucket=$(terraform output -raw site_bucket)
          distribution_id=$(terraform output -raw distribution_id)
          site_url=$(terraform output -raw site_url)
          {
            echo "SITE_BUCKET=$site_bucket"
            echo "DISTRIBUTION_ID=$distribution_id"
            echo "SITE_URL=$site_url"
          } >> "$GITHUB_ENV"

      # Hashed assets are immutable and never deleted, so a tab still holding
      # the previous index.html keeps loading; everything else is short-lived
      # and index.html is revalidated on every load.
      - name: publish
        working-directory: web/dist
        run: |
          aws s3 sync assets "s3://$SITE_BUCKET/assets" \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 sync . "s3://$SITE_BUCKET" --delete \
            --exclude "assets/*" --exclude "index.html" \
            --cache-control "public, max-age=300"
          aws s3 cp index.html "s3://$SITE_BUCKET/index.html" \
            --cache-control "no-cache"
          # Every client-side route is cached under /index.html (the
          # spa-rewrite function), so that one path is enough.
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" \
            --paths "/index.html" --query Invalidation.Id --output text
          echo "Deployed to $SITE_URL" >> "$GITHUB_STEP_SUMMARY"
